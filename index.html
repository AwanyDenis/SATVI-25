<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SATVI 25 Publications</title>

    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            background-color: #f7f9fb;
            color: #333;
        }

        .header {
            text-align: center;
            padding: 50px 20px 30px 20px;
        }

        .logo {
            max-width: 220px;
            height: auto;
            margin-bottom: 25px;
        }

        h1 {
            font-size: 36px;
            margin-bottom: 15px;
            color: #1d4f7a;
        }

        .tagline {
            font-size: 24px;
            line-height: 1.5;
            color: #555;
            font-weight: 500;
        }

        .highlight {
            color: #B6D246;
            font-weight: bold;
        }

        .content {
            max-width: 900px;
            margin: 0 auto;
            padding: 30px 20px;
            text-align: center;
        }

        .button {
            display: inline-block;
            margin-top: 25px;
            padding: 14px 28px;
            background-color: #1d4f7a;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
        }

        .button:hover {
            opacity: 0.85;
        }

        footer {
            text-align: center;
            margin-top: 60px;
            padding: 25px;
            color: #777;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="header">

        <img
            src="assets/satvi-logo.png"
            alt="SATVI Logo"
            class="logo"
        >

        <h1>SATVI 25 Publications</h1>

        <div class="tagline">
            The road towards a world without TB<br>
            <span class="highlight">
                Celebrating 25 years of research
            </span>
        </div>

    </div>

    <div class="content">

        <p>
            Explore a selection of publications highlighting 25 years
            of tuberculosis research
        </p>

        <a href="publications/" class="button">
            View Publications
        </a>

    </div>

    <footer>
        SATVI 25 Years of Research
    </footer>

</body>

</html>
